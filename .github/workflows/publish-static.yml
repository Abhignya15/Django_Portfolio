name: Publish static to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    name: Publish staticfiles to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Django_prep/requirements.txt

      - name: Collect static
        run: |
          python Django_prep/manage.py collectstatic --noinput

      - name: Deploy static to gh-pages (force-push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
          fi
          # copy staticfiles into repo root
          cp -r staticfiles/. . || true
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish staticfiles from workflow: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages --force
          fi
