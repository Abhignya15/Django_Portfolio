name: Publish static to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    name: Publish staticfiles to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Django_prep/requirements.txt

      - name: Collect static
        run: |
          python Django_prep/manage.py collectstatic --noinput

      - name: Deploy static to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./staticfiles
